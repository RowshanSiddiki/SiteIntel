{% extends "base.html" %}
{% block title %}Something went wrong · SiteIntel{% endblock %}
{% block content %}
<section class="error-card">
  <p class="eyebrow">TEMPORARY ISSUE</p>
  <h1>We could not complete that request.</h1>
  <p>{{ message|default("Please try again in a moment.") }}</p>
  <a class="button button-primary" href="{{ url_for('auth.login') }}">Return to login</a>
</section>
{% endblock %}
